# CareVoyage API — build, push to Docker Hub, deploy on VM via SSH
#
# --- GitHub Actions secrets (Settings → Secrets and variables → Actions) ---
# DOCKERHUB_USERNAME   Docker Hub username (e.g. hasnahasan)
# DOCKERHUB_TOKEN      Docker Hub access token (Account Settings → Security)
# VM_HOST              VM public IP or DNS
# VM_USER              SSH user with Docker access (e.g. in `docker` group)
# VM_SSH_KEY           Private key (full PEM/OpenSSH block) for that user
# VM_DEPLOY_PATH       (optional) Absolute path to git clone on VM; default below if unset
#
# --- One-time VM setup (manual) ---
# - Install Docker + Docker Compose v2; add deploy user to `docker` group
# - git clone this repo to the deploy path; place production `.env` next to compose.yml
# - TLS: /etc/letsencrypt on host (unchanged by CI)
# - Private repo: deploy key or HTTPS credentials so `git pull` works
# - docker login on VM if Hub images are private
#
# --- After first deploy: verify ---
# - Docker Hub: new tags `latest` and `sha-<shortsha>`
# - VM: `docker compose ps` shows recreated `api` container
#
name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - LICENSE

env:
  IMAGE_NAME: hasnahasan/carevoyage-api

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Collect SSH host keys
        id: ssh_known_hosts
        shell: bash
        run: |
          set -euo pipefail
          KNOWN_HOSTS="$(ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" 2>/dev/null)"
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "ssh-keyscan produced no output for VM_HOST='${{ secrets.VM_HOST }}'" >&2
            exit 1
          fi
          {
            echo "known_hosts<<EOF"
            echo "$KNOWN_HOSTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SSH deploy — git pull and docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          known_hosts: ${{ steps.ssh_known_hosts.outputs.known_hosts }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VM_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/home/deploy/carevoyage-api"
            fi
            cd "$DEPLOY_PATH"
            git pull origin main
            docker compose pull api
            docker compose up -d
